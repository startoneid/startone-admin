<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>StarTone Admin</title>

<link rel="icon" href="icon/StarTone Circle.png" type="image/x-icon">

<meta name="robots"
content="noindex,nofollow">

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="topbar">

    <h1>StarTone Admin Dashboard</h1>

    <button id="logoutBtn">
        Logout
    </button>

</div>

<div class="dashboard">

    <div class="card">
        <h3>Total Order</h3>
        <h2 id="totalOrders">0</h2>
    </div>

    <div class="card">
        <h3>Waiting</h3>
        <h2 id="waitingOrders">0</h2>
    </div>

    <div class="card">
        <h3>Verified</h3>
        <h2 id="verifiedOrders">0</h2>
    </div>

    <div class="card">
        <h3>Revenue</h3>
        <h2 id="totalRevenue">Rp0</h2>
    </div>

</div>

<div class="toolbar">

    <input
        type="text"
        id="searchInput"
        placeholder="🔍 Cari customer atau produk...">

    <select id="statusFilter">

        <option value="all">Semua Status</option>

        <option value="waiting">
            Waiting
        </option>

        <option value="waiting_verification">
            Waiting Verification
        </option>

        <option value="verified">
            Verified
        </option>

        <option value="rejected">
            Rejected
        </option>

    </select>

</div>

<div class="card" style="margin-top: 20px; padding: 20px; background: #35363A; border-radius: 15px;">
    <h3 style="color: #FFD166; margin-bottom: 15px;">➕ Tambah Produk Preset Baru</h3>
    <form id="addProductForm" style="display: flex; flex-direction: column; gap: 12px; max-width: 500px;">
        <input type="text" id="newProdName" placeholder="Nama Preset (Contoh: Summer Tone)" required style="padding: 12px; border-radius: 8px; border: none; background: #222; color: white;">
        
        <input type="number" id="newProdPrice" placeholder="Harga (Contoh: 50000)" required style="padding: 12px; border-radius: 8px; border: none; background: #222; color: white;">
        
        <input type="text" id="newProdImage" placeholder="Path Gambar Cover (Contoh: images/presets-1.jpg)" required style="padding: 12px; border-radius: 8px; border: none; background: #222; color: white;">
        
        <input type="url" id="newProdDownload" placeholder="Link Download Preset (Google Drive/Cloud)" required style="padding: 12px; border-radius: 8px; border: none; background: #222; color: white;">
        
        <button type="submit" style="background: #28a745; color: white; padding: 12px; font-size: 15px;">💾 Simpan Produk</button>
    </form>
</div>

<div class="toolbar" style="margin-top: 30px;">
...

<table>

<thead>

<tr>

<th>Invoice</th>

<th>Customer</th>

<th>Produk</th>

<th>Harga</th>

<th>Bukti Pembayaran</th>

<th>Status</th>

<th>Aksi</th>

</tr>

</thead>

<tbody id="orders">

</tbody>

</table>

<script type="module" src="admin.js"></script>

</body>

</html>
