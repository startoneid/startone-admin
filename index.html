<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>StarTone Admin</title>

<link rel="icon" href="icon/StarTone Circle.png" type="image/x-icon">

<meta name="robots"
content="noindex,nofollow">

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="topbar">

    <h1>StarTone Admin Dashboard</h1>

    <button id="logoutBtn">
        Logout
    </button>

</div>

<div class="dashboard">

    <div class="card">
        <h3>Total Order</h3>
        <h2 id="totalOrders">0</h2>
    </div>

    <div class="card">
        <h3>Waiting</h3>
        <h2 id="waitingOrders">0</h2>
    </div>

    <div class="card">
        <h3>Verified</h3>
        <h2 id="verifiedOrders">0</h2>
    </div>

    <div class="card">
        <h3>Revenue</h3>
        <h2 id="totalRevenue">Rp0</h2>
    </div>

</div>

<div class="section-header">
    <h2>Kelola Produk (Featured Collections)</h2>
    <button id="toggleProductForm">+ Tambah Produk</button>
</div>

<div class="product-form-wrapper" id="productFormWrapper" style="display:none;">

    <form id="productForm">

        <input type="hidden" id="productId">

        <input type="text" id="productName" placeholder="Nama Produk (contoh: Summer Tone)" required>

        <input type="number" id="productPrice" placeholder="Harga dalam angka (contoh: 15000)" required min="0">

        <input type="url" id="productImage" placeholder="Link Gambar / URL Gambar" required>

        <textarea id="productShortDesc" placeholder="Deskripsi singkat (tampil di kartu halaman utama)" required></textarea>

        <textarea id="productDetail" placeholder="Detail lengkap produk (tampil saat produk diklik di halaman utama)" required></textarea>

        <textarea id="productTips" placeholder="Tips penggunaan produk (tampil saat produk diklik di halaman utama)"></textarea>

        <div class="form-actions">
            <button type="submit" id="productSubmitBtn">Simpan Produk</button>
            <button type="button" id="productCancelBtn">Batal</button>
        </div>

    </form>

</div>

<table>

<thead>
<tr>
<th>Gambar</th>
<th>Nama Produk</th>
<th>Harga</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="productsTable"></tbody>

</table>

<div class="section-header" style="margin-top:60px;">
    <h2>Daftar Order Masuk</h2>
</div>

<div class="toolbar">

    <input
        type="text"
        id="searchInput"
        placeholder="🔍 Cari customer atau produk...">

    <select id="statusFilter">

        <option value="all">Semua Status</option>

        <option value="waiting">
            Waiting
        </option>

        <option value="waiting_verification">
            Waiting Verification
        </option>

        <option value="verified">
            Verified
        </option>

        <option value="rejected">
            Rejected
        </option>

    </select>

</div>

<table>

<thead>

<tr>

<th>Invoice</th>

<th>Customer</th>

<th>Produk</th>

<th>Harga</th>

<th>Bukti Pembayaran</th>

<th>Status</th>

<th>Aksi</th>

</tr>

</thead>

<tbody id="orders">

</tbody>

</table>

<script type="module" src="admin.js"></script>

</body>

</html>
