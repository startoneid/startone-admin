<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>StarTone Admin</title>

<link rel="icon" href="icon/StarTone Circle.png" type="image/x-icon">

<meta name="robots"
content="noindex,nofollow">

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="topbar">

    <h1>StarTone Admin Dashboard</h1>

    <button id="logoutBtn">
        Logout
    </button>

</div>

<div class="dashboard">

    <div class="card">
        <h3>Total Order</h3>
        <h2 id="totalOrders">0</h2>
    </div>

    <div class="card">
        <h3>Waiting</h3>
        <h2 id="waitingOrders">0</h2>
    </div>

    <div class="card">
        <h3>Verified</h3>
        <h2 id="verifiedOrders">0</h2>
    </div>

    <div class="card">
        <h3>Revenue</h3>
        <h2 id="totalRevenue">Rp0</h2>
    </div>

</div>

<div class="card" style="margin-bottom: 30px; background: #35363A; padding: 25px; border-radius: 15px; border: 1px solid #FFD166;">
    <h2 style="color: #FFD166; margin-bottom: 15px;">➕ Tambah Produk Baru</h2>
    
    <form id="addProductForm" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 25px;">
        <input type="text" id="newProdName" placeholder="Nama Produk (cth: Cinematic Preset)" required style="padding: 12px; border-radius: 8px; border: none; background: #222; color: white;">
        <input type="number" id="newProdPrice" placeholder="Harga dalam Rupiah (cth: 50000)" required style="padding: 12px; border-radius: 8px; border: none; background: #222; color: white;">
        <input type="text" id="newProdImage" placeholder="URL Link Gambar / Cover Produk" required style="padding: 12px; border-radius: 8px; border: none; background: #222; color: white;">
        <input type="text" id="newProdDrive" placeholder="Link Google Drive (Untuk Download File)" required style="padding: 12px; border-radius: 8px; border: none; background: #222; color: white;">
        <textarea id="newProdDesc" placeholder="Deskripsi singkat produk..." style="grid-column: span 2; padding: 12px; border-radius: 8px; border: none; background: #222; color: white; height: 80px; font-family: inherit;"></textarea>
        
        <button type="submit" style="grid-column: span 2; background: #FFD166; color: black; font-weight: bold; cursor: pointer; padding: 12px;">🚀 Simpan & Terbitkan Produk</button>
    </form>

    <hr style="border: 0.5px solid #555; margin-bottom: 20px;">

    <h3 style="color: white; margin-bottom: 10px;">📦 Daftar Produk Aktif</h3>
    <div style="overflow-x: auto;">
        <table style="width: 100%; margin-top: 10px;">
            <thead>
                <tr>
                    <th style="background: #222; color: #FFD166;">Cover</th>
                    <th style="background: #222; color: #FFD166;">Nama Produk</th>
                    <th style="background: #222; color: #FFD166;">Harga</th>
                    <th style="background: #222; color: #FFD166;">Aksi</th>
                </tr>
            </thead>
            <tbody id="activeProductsList">
                </tbody>
        </table>
    </div>
</div>

<div class="toolbar">

    <input
        type="text"
        id="searchInput"
        placeholder="🔍 Cari customer atau produk...">

    <select id="statusFilter">

        <option value="all">Semua Status</option>

        <option value="waiting">
            Waiting
        </option>

        <option value="waiting_verification">
            Waiting Verification
        </option>

        <option value="verified">
            Verified
        </option>

        <option value="rejected">
            Rejected
        </option>

    </select>

</div>

<table>

<thead>

<tr>

<th>Invoice</th>

<th>Customer</th>

<th>Produk</th>

<th>Harga</th>

<th>Bukti Pembayaran</th>

<th>Status</th>

<th>Aksi</th>

</tr>

</thead>

<tbody id="orders">

</tbody>

</table>

<script type="module" src="admin.js"></script>

</body>

</html>
